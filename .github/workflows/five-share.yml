# Helper: encodes this account's share of the pieces of a movie that the hub account prepared.
# The pieces are read from, and the results sent back to, the hub's temporary storage (HUB_TOKEN).
# Nothing is stored in this repo except this file: the program and its settings are sent encrypted
# with every run (the key is the repository secret LINK_KEY).
name: Multi Encode Share

on:
  workflow_dispatch:
    inputs:
      hub:
        description: "Hub repository (owner/name)"
        required: true
      tag:
        description: "Hub's temporary storage tag"
        required: true
      pieces:
        description: "This account's pieces, e.g. [1,5,9]"
        required: true
      parallel:
        description: "Pieces encoded at the same time on this account (its slots)"
        required: true
        default: "20"
      bundle:
        description: "Encrypted program + settings (sent by matrixv.py)"
        required: true

env:
  GH_REPO: ${{ inputs.hub }}
  SCRATCH_TAG: ${{ inputs.tag }}
  LINK_KEY: ${{ secrets.LINK_KEY }}
  BUNDLE: ${{ inputs.bundle }}
  QUIET_LOG: "1"
  CLEAN_META: "1"
  PYTHONUNBUFFERED: "1"
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz

jobs:
  # One small job first: it waits for the hub's plan (uploaded before the cutting starts) and keeps
  # only this account's pieces that exist in the movie - a shorter movie has fewer pieces than were
  # planned. So no job starts for a piece that does not exist, and no runners wait idle while the
  # hub downloads the movie.
  share:
    name: Wait for the plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.share.outputs.matrix }}
      count: ${{ steps.share.outputs.count }}
    steps:
      - name: Prepare
        run: printf '%s' "$BUNDLE" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -a -A -pass env:LINK_KEY | tar -xz

      - name: Which of my pieces exist
        id: share
        env:
          GH_TOKEN: ${{ secrets.HUB_TOKEN }}
          PIECES: ${{ inputs.pieces }}
        run: python3 split_encode.py share "$PIECES"

  # Then one job per piece: it installs ffmpeg, waits for its own piece and starts on it the moment
  # the hub has uploaded it.
  encode:
    name: Piece ${{ matrix.chunk }}
    needs: share
    if: needs.share.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix:
        chunk: ${{ fromJSON(needs.share.outputs.matrix) }}
    steps:
      - name: Prepare
        run: printf '%s' "$BUNDLE" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -a -A -pass env:LINK_KEY | tar -xz

      - name: Install ffmpeg
        run: |
          curl -fsSL "$FFMPEG_URL" | tar -xJ -C /opt
          echo "/opt/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"

      - name: Wait for my piece
        env:
          GH_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: python3 split_encode.py wait ${{ matrix.chunk }}

      - name: Encode
        env:
          GH_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: python3 split_encode.py encode ${{ matrix.chunk }}
